<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результат проверки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="mb-4">Результат проверки доступа</h2>

            <p><strong>Время:</strong> {{ timestamp }}</p>
            <p><strong>Пользователь:</strong> {{ username }}</p>
            <p><strong>Роль:</strong> {{ role }}</p>
            <p><strong>Образ ВМ:</strong> {{ image_name }}</p>
            <p><strong>Операция:</strong> {{ operation }}</p>

            {% if action == "Разрешено" %}
                <div class="alert alert-success">
                    <strong>{{ action }}</strong>: {{ reason }}
                </div>
            {% else %}
                <div class="alert alert-danger">
                    <strong>{{ action }}</strong>: {{ reason }}
                </div>
            {% endif %}

            <a href="{% url 'tasks:index' %}" class="btn btn-primary">На главную</a>
            <a href="{% url 'tasks:logs' %}" class="btn btn-outline-secondary">К журналу</a>
        </div>
    </div>
</div>

</body>
</html>
