apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
        listen 80;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: vmguard-pod
  labels:
    app: vmguard
spec:
  containers:
    - name: postgres
      image: postgres:15
      ports:
        - containerPort: 5432
      env:
        - name: POSTGRES_DB
          value: "vmguard_db"
        - name: POSTGRES_USER
          value: "vmguard_user"
        - name: POSTGRES_PASSWORD
          value: "vmguard_pass"

    - name: django-app
      image: container-django-app:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 8000
      env:
        - name: DB_NAME
          value: "vmguard_db"
        - name: DB_USER
          value: "vmguard_user"
        - name: DB_PASSWORD
          value: "vmguard_pass"
        - name: DB_HOST
          value: "127.0.0.1"
        - name: DB_PORT
          value: "5432"
      command: ["sh", "-c"]
      args:
        - sleep 10 && python manage.py migrate && python manage.py runserver 0.0.0.0:8000

    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80
      volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf

    - name: adminer
      image: adminer
      ports:
        - containerPort: 8080
  volumes:
    - name: nginx-config-volume
      configMap:
        name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: vmguard-nginx-service
spec:
  type: NodePort
  selector:
    app: vmguard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: vmguard-adminer-service
spec:
  type: NodePort
  selector:
    app: vmguard
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30081