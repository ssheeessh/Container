services:
  django-app:
    build: .
    container_name: django-app
    expose:
      - "8000"
    depends_on:
      - postgres
    environment:
      DB_NAME: vmguard_db
      DB_USER: vmguard_user
      DB_PASSWORD: vmguard_pass
      DB_HOST: postgres
      DB_PORT: 5432

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - django-app

  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: vmguard_db
      POSTGRES_USER: vmguard_user
      POSTGRES_PASSWORD: vmguard_pass
    ports:
      - "5432:5432"

  adminer:
    image: adminer
    container_name: adminer-ui
    ports:
      - "8081:8080"
    depends_on:
      - postgres